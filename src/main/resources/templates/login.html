<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход — BankConsultant</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body class="auth-body">
<div class="auth-card">
    <h1>Вход в систему</h1>
    <p class="subtitle">Введите email и пароль для доступа к подбору кредитов</p>

    <p th:if="${success}" class="success" th:text="${success}"></p>
    <p th:if="${error}" class="error" th:text="${error}"></p>

    <form action="/login" method="post">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit">Войти</button>
    </form>
    <div class="link">
        Нет аккаунта? <a href="/register">Зарегистрироваться</a>
    </div>
    <div class="link">
        <a href="/">← На главную</a>
    </div>
</div>
</body>
</html>
