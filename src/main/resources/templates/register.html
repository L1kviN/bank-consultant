<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>
<body>
<h2>Регистрация</h2>

<p th:if="${success}" style="color: green;" th:text="${success}"></p>
<p th:if="${error}" style="color: red;" th:text="${error}"></p>

<form action="/register" method="post">
    <input type="text" name="fullName" placeholder="ФИО" required><br>
    <input type="email" name="email" placeholder="Email" required><br>
    <input type="password" name="password" placeholder="Пароль" required><br>
    <input type="tel" name="phone" placeholder="Телефон"><br>
    <input type="date" name="birthDate" placeholder="Дата рождения"><br>
    <button type="submit">Зарегистрироваться</button>
</form>
<a href="/login">Уже есть аккаунт? Войти</a>
</body>
</html>
