<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход или регистрация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .card h1 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #333;
        }

        .card p {
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-login {
            background: #667eea;
            color: white;
            border: 2px solid #667eea;
        }

        .btn-login:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .btn-register {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-register:hover {
            background: #667eea;
            color: white;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #999;
            text-decoration: none;
        }

        .back-link:hover {
            color: #667eea;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🔐 Для подбора кредита</h1>
    <p>Войдите в свой аккаунт или создайте новый, чтобы продолжить</p>
    <div class="btn-group">
        <a href="/login" class="btn btn-login">Войти</a>
        <a href="/register" class="btn btn-register">Зарегистрироваться</a>
    </div>
    <a href="/" class="back-link">← Вернуться на главную</a>
</div>
</body>
</html>
