<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход или регистрация — BankConsultant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a;
            color: #e8edf2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: #111827;
            border: 1px solid #1f2a3a;
            border-radius: 20px;
            padding: 48px;
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        .card h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }
        .card p {
            color: #94a3b8;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .btn-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 32px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        .btn-outline {
            border: 1px solid #3b82f6;
            color: #3b82f6;
            background: transparent;
        }
        .btn-outline:hover {
            background: rgba(59,130,246,0.1);
        }
        .back-link {
            display: inline-block;
            margin-top: 32px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            color: #3b82f6;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🔐 Требуется авторизация</h1>
    <p>Для подбора кредита необходимо войти или зарегистрироваться</p>
    <div class="btn-group">
        <a href="/login" class="btn btn-primary">Войти</a>
        <a href="/register" class="btn btn-outline">Зарегистрироваться</a>
    </div>
    <a href="/" class="back-link">← Вернуться на главную</a>
</div>
</body>
</html>
