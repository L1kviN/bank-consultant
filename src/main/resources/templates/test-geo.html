<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест геолокации</title>
</head>
<body>
<h2>Тест геолокации</h2>
<button id="getLocation">Определить местоположение</button>
<div id="result"></div>

<script>
    document.getElementById('getLocation').addEventListener('click', function() {
        if (navigator.geolocation) {
            document.getElementById('result').innerHTML = '⏳ Запрос разрешения...';

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;
                    document.getElementById('result').innerHTML =
                        '✅ Успешно!<br>' +
                        'Широта: ' + lat + '<br>' +
                        'Долгота: ' + lng;
                },
                function(error) {
                    var message = '';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            message = '❌ Доступ запрещен. Разрешите в браузере.';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            message = '❌ Не удалось определить.';
                            break;
                        case error.TIMEOUT:
                            message = '❌ Время истекло.';
                            break;
                        default:
                            message = '❌ Ошибка: ' + error.message;
                    }
                    document.getElementById('result').innerHTML = message;
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000
                }
            );
        } else {
            document.getElementById('result').innerHTML = '❌ Ваш браузер не поддерживает геолокацию';
        }
    });
</script>
</body>
</html>
